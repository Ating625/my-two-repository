    <div class="scene__body">
        <p>照片里左边那个人是你爸，「初三（8）班」的牌子挂在门口，他背着 D'ckies 的书包，冲着镜头比了个耶，笑得有点拘谨；右边是他当年的同学，手里举着一张证件。</p>
        <p>这张照片的年份已经记不清了，但有一点很清楚：他也曾经是这个样子——校服、书包、站在教室门口，被人随手按下一次快门。</p>
    </div>
